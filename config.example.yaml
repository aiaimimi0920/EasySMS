# EasySms local development config
#
# Production and preview deployments on Cloudflare Workers are managed via
# SpringBok using `.sba/manifest.json` (v3) and `.sba/deployment.json` (v2),
# with secrets stored in SpringBok's encrypted `applicationSecrets` vault.
#
# For local development (`npm run dev` in `service/base`), copy this file to
# `config.yaml` and fill in only the values you need locally.

serviceBase:
  runtime:
    server:
      host: 127.0.0.1
      port: 8080
      apiKey: "replace-with-local-bearer-token"

    strategy:
      strictProviderMode: false
      providerStrategyModeId: aggregate-latest

    maintenance:
      enabled: true
      intervalMs: 30000
      keepRecentCount: 100
      activeProbeEnabled: true
      activeProbeIntervalMs: 300000

    persistence:
      enabled: true
      driver: file
      intervalMs: 60000
      filePath: state/easy-sms-state.json

    scraping:
      requestTimeoutMs: 15000
      providerRequestTimeoutMs:
        onlinesim: 15000
        smstome: 30000
        receive_smss: 25000
        receive_sms_free_cc: 25000
        sms24: 20000
        yunduanxin: 20000
        hero_sms: 15000
      maxNumbersPerProvider: 20
      userAgent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36

    providers:
      enabledProviders:
        - onlinesim
        - smstome
        - receive_smss
        - receive_sms_free_cc
        - sms24
        - yunduanxin
      onlineSim:
        apiKey: ""
      smsToMe:
        email: ""
        password: ""
      receiveSmss:
        username: ""
        password: ""
      receiveSmsFreeCc:
        email: ""
        password: ""
      synthetic:
        leaseWindowSeconds: 1200
        terminalOutcomeCooldownSeconds: 7200
      heroSms:
        enabled: false
        apiKey: ""
        baseUrl: https://hero-sms.com/stubs/handler_api.php
        defaultService: dr
        defaultCountry: 16
        selectionMode: balanced
        reuseEnabled: true
        defaultMaxBindingsPerPhone: 1
        refundableCancelWindowSeconds: 120
        leaseWindowSeconds: 1200
