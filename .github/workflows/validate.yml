name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        shell: pwsh
        run: python -m pip install --no-cache-dir pyyaml

      - name: Create Local Operator Config
        shell: pwsh
        run: Copy-Item config.example.yaml config.yaml -Force

      - name: Run Repository Validation
        shell: pwsh
        run: .\scripts\test-all.ps1

      - name: Validate Release Contract
        shell: pwsh
        run: python scripts/validate-release-contract.py
